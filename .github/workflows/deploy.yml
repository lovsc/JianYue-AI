name: 发布到正式网站

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jianyue-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://octopush5.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: 安装依赖
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund
      - name: 验证后端及发布回滚逻辑
        run: |
          npm test --prefix backend
          python3 -m unittest discover -s deploy/tests -v
      - name: 构建发布包
        id: package
        env:
          RELEASE_SHA: ${{ github.sha }}
          VITE_ICP_RECORD: 黔ICP备2025053618号-1
        run: node scripts/package-release.mjs
      - name: 上传并发布（服务器自动备份及失败回滚）
        env:
          DEPLOY_KEY: ${{ secrets.JY_DEPLOY_SSH_KEY }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo '请先在 production 环境中配置 JY_DEPLOY_SSH_KEY。'
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/jianyue-deploy-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          digest="$(sha256sum "$ARCHIVE_PATH" | cut -d ' ' -f 1)"
          ssh -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            -p 22 jianyue-deploy@123.57.37.19 "deploy $RELEASE_SHA $digest" < "$ARCHIVE_PATH"
      - name: 从公网确认发布版本
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://octopush5.com/api/v1/health', { signal: AbortSignal.timeout(20000), cache: 'no-store' });
          const value = await response.json();
          if (!response.ok || !value.success || value.data.releaseSha !== process.env.RELEASE_SHA) throw new Error('线上版本核验失败，请查看服务端发布日志');
          console.log('上线成功：https://octopush5.com');
          JS
          printf '### 发布成功\n\n网站：https://octopush5.com\n\n版本：`%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
